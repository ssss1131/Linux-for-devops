- name: Set timezone
  community.general.timezone:
    name: "{{ timezone }}"

- name: Add project servers to /etc/hosts
  lineinfile:
    path: /etc/hosts
    line: "{{ item }}"
  loop: "{{ hosts_lines }}"

- name: Update apt cache and upgrade packages
  apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Install base packages
  apt:
    name: "{{ base_packages }}"
    state: present
