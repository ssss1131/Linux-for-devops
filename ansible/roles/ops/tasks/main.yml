- name: Install node exporter
  apt:
    name: prometheus-node-exporter
    state: present

- name: Copy Prometheus config
  copy:
    src: prometheus.yml
    dest: /etc/nc-ttp/prometheus/prometheus.yml
    owner: root
    group: root
    mode: "644"

- name: Start node exporter and enable on boot
  service:
    name: prometheus-node-exporter
    state: started
    enabled: yes
